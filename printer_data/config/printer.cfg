[include mainsail.cfg]
[include fluidd.cfg]
[include timelapse.cfg]

[include macros/*.cfg]
[include ext_configs/*.cfg]
[include Klicky/klicky-probe.cfg]
[include KAMP_Settings.cfg]
[include K-ShakeTune/*.cfg]

[include chopper_tune.cfg]

[respond]
[exclude_object]

[gcode_arcs]
resolution: 0.1

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_Octopus_Pro_V1.1-if00

[idle_timeout]
timeout: 1200

[printer]
kinematics: corexy
max_velocity: 400
max_accel: 10000
#max_accel_to_decel: 5000
minimum_cruise_ratio: 0.5
max_z_velocity: 12
max_z_accel: 350
square_corner_velocity: 10

[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 400
endstop_pin: ^PG6
position_endstop = -3
position_min = -3
position_max: 235
homing_speed: 70
homing_positive_dir: false

[tmc5160 stepper_x]
cs_pin: PC4
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
sense_resistor: 0.075
run_current: 0.8 #1.1
interpolate: True
stealthchop_threshold: 0
#hold_current: 0.800
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 2
driver_TBL: 1


[stepper_x1]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 400

[tmc5160 stepper_x1]
cs_pin: PD11
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
sense_resistor: 0.075
run_current: 0.8 #1.1
interpolate: True
stealthchop_threshold: 0
#hold_current: 0.800
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 2
driver_TBL: 1


[stepper_y]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 400
endstop_pin: ^PG9
position_endstop: 0
position_min: -1
position_max: 245
homing_speed: 70

[tmc5160 stepper_y]
cs_pin: PC6
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
sense_resistor: 0.075
run_current: 0.8 #1.1
interpolate: True
stealthchop_threshold: 0
#hold_current: 0.800
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 2
driver_TBL: 1


[stepper_y1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 400

[tmc5160 stepper_y1]
cs_pin: PC7
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
sense_resistor: 0.075
run_current: 0.8 #1.1
interpolate: True
stealthchop_threshold: 0
#hold_current: 0.800
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 2
driver_TBL: 1


[stepper_z]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
#endstop_pin: ^!PG10
#position_endstop: 0.0
position_max: 210
position_min: -2

[tmc2209 stepper_z]
uart_pin: PE1
run_current: 1.200
hold_current: 0.600


[extruder]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
Gear_ratio: 60:10
rotation_distance: 35.8  #4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 6
pressure_advance = 0.026
max_extrude_only_distance: 100.0
heater_pin: PA0
sensor_type: MAX31865
sensor_pin: PF8
spi_speed: 4000000
spi_software_sclk_pin: PA5 
spi_software_mosi_pin: PA7 
spi_software_miso_pin: PA6 
rtd_use_50Hz_filter: True
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
min_temp: 0
max_temp: 350


[tmc2209 extruder]
uart_pin: PE4
#tx_pin: PC10
#uart_address: 3
run_current: 0.75
#hold_current: 0.100
#sense_resistor: 0.11
#stealthchop_threshold: 999999

[probe]
pin: PG10
#deactivate_on_each_sample: True
x_offset: 0
y_offset: 20.5
samples: 3
#activate_gcode: ATTACH_PROBE
#eactivate_gcode: DOCK_PROBE
#z_offset: 9
#speed: 5.0

[bed_mesh]
speed: 280
horizontal_move_z: 6
mesh_min: 15, 26
mesh_max: 220, 205
probe_count: 9, 9
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[heater_bed]
heater_pin: PB11
sensor_type: Generic 3950
sensor_pin: PF3
min_temp: 0
max_temp: 130

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF7
min_temp: 0
max_temp: 100
gcode_id: C

[screws_tilt_adjust]
screw1: 117.5,200
screw1_name: center back screw
screw2: 30,11
screw2_name: front left screw
screw3: 201,11
screw3_name: front right screw
horizontal_move_z: 11.
speed: 300.
screw_thread: CW-M4

[heater_fan Heatbreak]
## heatbreak fan
pin: PA8
max_power: 1.0
hardware_pwm: false
heater: extruder
heater_temp: 55.0
fan_speed: 1.0

[fan]  ## part cooling fan
pin: PE10
max_power: 0.87
kick_start_time: 0.1
cycle_time: 0.00004 #25kHz
hardware_pwm: False
off_below: 0.06

[fan_generic Exhaust_fan]  ##  exhaust fan
pin: PD12
hardware_pwm: false
cycle_time: 0.060
max_power: 1.0
kick_start_time: 0.3
off_below: 0.10
#kick_start_time: 0.2
#off_below: 0.10

[fan_generic Nevermore_fan]
##  Never More Filter
pin: PE5
hardware_pwm: false
cycle_time: 0.05
max_power: 1.0
kick_start_time: 0.3
off_below: 0.10

[controller_fan Backpanel]
pin: PD13
hardware_pwm: False
stepper: stepper_x,stepper_y,stepper_x1,stepper_y1

[servo klicky_servo]
pin: PB6
initial_angle: 145
maximum_servo_angle: 180
minimum_pulse_width: 0.00025
maximum_pulse_width: 0.0024

[input_shaper]
shaper_freq_x: 125.6
shaper_type_x: mzv
shaper_freq_y: 93.8
shaper_type_y: mzv

#[neopixel my_led]
#pin: PA8
#chain_count: 3
#color_order: GRB

