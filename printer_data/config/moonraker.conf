[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /home/patrick/printer_data/comms/klippy.sock

[authorization]
trusted_clients:
    127.0.0.1
    192.168.0.0/16
cors_domains:
    *.lan
    *.local
    *://localhost
    *://localhost:*
    *://my.mainsail.xyz
    *://app.fluidd.xyz
    
[octoprint_compat]

[history]

[mqtt]
address: 192.168.178.64
port: 1883
username: {secrets.mqtt_credentials.username}
password: {secrets.mqtt_credentials.password}
mqtt_protocol: v3.1.1
enable_moonraker_api: True
publish_split_status: False
instance_name: klipper_printers/v24695
status_interval: 2
status_objects:
    webhooks
    temperature_sensor chamber=temperature
    extruder=temperature,target
    heater_bed=temperature,target
    fan=speed
    virtual_sdcard=progress
    print_stats
default_qos: 0

[sensor printer_power]
type: mqtt
state_topic: tasmota/ke_voron24/tele/SENSOR
state_response_template:
    {% set resp = payload|fromjson %}
    {% set edata = resp["ENERGY"] %}
    {set_result("power", edata["Power"])}
    {set_result("today", edata["Today"])}
    {set_result("total", edata["Total"])}
parameter_power:
    units=W
parameter_today:
    units=kWh
parameter_total:
    units=kWh

[update_manager]
channel: dev
refresh_interval: 168

[update_manager mainsail]
path: /home/patrick/mainsail
repo: mainsail-crew/mainsail
channel: stable
type: web

[update_manager mainsail-config]
managed_services: klipper
origin: https://github.com/mainsail-crew/mainsail-config.git
path: /home/patrick/mainsail-config
primary_branch: master
type: git_repo

# Crowsnest update_manager entry
[update_manager crowsnest]
type: git_repo
path: ~/crowsnest
origin: https://github.com/mainsail-crew/crowsnest.git
managed_services: crowsnest
install_script: tools/pkglist.sh

[update_manager mobileraker]
install_script: /home/patrick/mobileraker_companion/scripts/install.sh
requirements: /home/patrick/mobileraker_companion/scripts/mobileraker-requirements.txt
env: /home/patrick/mobileraker-env/bin/python
managed_services: mobileraker
primary_branch: main
origin: https://github.com/Clon1998/mobileraker_companion.git
path: /home/patrick/mobileraker_companion
type: git_repo

[update_manager KlipperScreen]
type: git_repo
path: ~/KlipperScreen
origin: https://github.com/KlipperScreen/KlipperScreen.git
virtualenv: ~/.KlipperScreen-env
requirements: scripts/KlipperScreen-requirements.txt
system_dependencies: scripts/system-dependencies.json
managed_services: KlipperScreen

[update_manager Klipper-Adaptive-Meshing-Purging]
type: git_repo
channel: dev
path: ~/Klipper-Adaptive-Meshing-Purging
origin: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging.git
managed_services: klipper
primary_branch: main

[update_manager beacon]
type: git_repo
channel: dev
path: ~/beacon_klipper
origin: https://github.com/beacon3d/beacon_klipper.git
env: ~/klippy-env/bin/python
requirements: requirements.txt
install_script: install.sh
is_system_service: False
managed_services: klipper
info_tags:
  desc=Beacon Surface Scanner

# Klippain Shake&Tune automatic update management
[update_manager Klippain-ShakeTune]
type: git_repo
origin: https://github.com/Frix-x/klippain-shaketune.git
path: ~/klippain_shaketune
virtualenv: /home/patrick/klippy-env
requirements: requirements.txt
system_dependencies: system-dependencies.json
primary_branch: main
managed_services: klipper

[update_manager led_effect]
type: git_repo
path: ~/klipper-led_effect
origin: https://github.com/julianschill/klipper-led_effect.git
is_system_service: False

[update_manager klipper_tmc_autotune]
type: git_repo
channel: dev
path: ~/klipper_tmc_autotune
origin: https://github.com/andrewmcgr/klipper_tmc_autotune.git
managed_services: klipper
primary_branch: main
install_script: install.sh

[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main

### BEGIN KLIPPER-MOTD CONFIG
[update_manager klipper-motd]
type: git_repo
primary_branch: main
origin: https://www.github.com/tomaski/klipper-motd.git
path: ~/klipper-motd
is_system_service: False
### END KLIPPER-MOTD CONFIG

[update_manager happy-hare]
type: git_repo
path: ~/Happy-Hare
origin: https://github.com/moggieuk/Happy-Hare.git
primary_branch: main
managed_services: klipper

[file_manager]
enable_object_processing: True

[mmu_server]
enable_file_preprocessor: True
enable_toolchange_next_pos: True
update_spoolman_location: True

