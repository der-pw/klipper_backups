# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBCan]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: 8fbc4f7fa115

#[adxl345]
#cs_pin: EBBCan: PB12
#spi_bus: spi2_PB2_PB11_PB10
#axes_map: x,y,z

[extruder]
step_pin: EBBCan: PD0
dir_pin: !EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan: PA3
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.650
stealthchop_threshold: 999999
sense_resistor: 0.110

[fan]
pin: EBBCan: PA0

#[heater_fan hotend_fan]
#pin: EBBCan: PA1
#heater: extruder
#heater_temp: 50.0
#cycle_time: 0.00004 #10KHz PWM frecvency
#heater_temp: 60
#fan_speed: 0.6 # can be lowered to reduce fan noise
#shutdown_speed: 0.0
#max_power: 0.6 # can be lowered to reduce fan noise
#tachometer_pin: ^EBBCan: PB9
#tachometer_ppr: 2
#tachometer_poll_interval: 0.0005 #tachometer_poll_interval: 0.0009

[heater_fan hotend_fan]
pin: EBBCan: PA1
heater: extruder
heater_temp: 60

fan_speed: 0.6
max_power: 1.0

cycle_time: 0.00002
kick_start_time: 0.5

tachometer_pin: ^EBBCan: PB9
tachometer_ppr: 2
tachometer_poll_interval: 0.0005


#[neopixel hotend_rgb]
#pin: EBBCan:PD3

#[bltouch]
#sensor_pin: ^EBBCan:PB8
#control_pin: EBBCan:PB9

#[filament_switch_sensor switch_sensor]
#switch_pin: EBBCan:PB4

#[filament_motion_sensor motion_sensor]
#switch_pin: ^EBBCan:PB3