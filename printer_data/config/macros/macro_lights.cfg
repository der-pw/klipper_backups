######################################################################
# Chamber Lighting
######################################################################

[output_pin caselight]
pin: PA1
pwm: true
shutdown_value: 0
value: 0.2
cycle_time: 0.001

 
######################################################################
# Lighting Control
######################################################################

[gcode_macro CASELIGHT_OFF]
gcode:
    SET_PIN PIN=caselight VALUE=0
 
[gcode_macro CASELIGHT_ON]
gcode:
    SET_PIN PIN=caselight VALUE=0.85

[gcode_macro CASELIGHT_PRINT]
gcode:
    SET_PIN PIN=caselight VALUE=0.1


######################################################################
# Devices über HA und Moonraker schalten 
###################################################################### 

[gcode_macro LIGHT_TOGGLE]
description: Schaltet das Druckerlicht über Home Assistant um
gcode:
  {action_call_remote_method("set_device_power",
                             device="druckerlicht",
                             state="toggle")}

[gcode_macro LIGHT_ON]
description: Schaltet das Druckerlicht über Home Assistant ein
gcode:
  {action_call_remote_method("set_device_power",
                             device="druckerlicht",
                             state="on")}

[gcode_macro LIGHT_OFF]
description: Schaltet das Druckerlicht über Home Assistant aus
gcode:
  {action_call_remote_method("set_device_power",
                             device="druckerlicht",
                             state="off")}
