[gcode_macro LOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E60 F1000                   ; load
   G1 E40 F300                    ; prime nozzle with filament
   M82                            ; set extruder to absolute
    
[gcode_macro UNLOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E40 F400                    ; extrude a little to soften tip
   G1 E-100 F2000                  ; retract some, but not too much or it will jam
   M82                            ; set extruder to absolute

[gcode_macro CUT_FILAMENT]
description: Cut filament using the gantry depressor 
gcode:
    ;SET_FILAMENT_SENSOR SENSOR=toolhead ENABLE=0   ; disable above gear filament sensor 
    ;SET_FILAMENT_SENSOR SENSOR=extruder ENABLE=0   ; disable below gear filament sensor 
    G91                     ; Set relative positioning
    G1 Z2 F600              ; Optional: lift Z for clearance
    
    G90                     ; Back to absolute positioning
    G1 X10 Y270 F6000       ; Move to starting point (right of depressor)
    G1 X0 F1000             ; Move X left to depressor
    G1 Y284 F1000           ; Move Y in front of depressor
    G1 Y290 F800            ; Move back to trigger the cut

    G91                     ; Relative mode for retraction
    G1 E-25 F1000           ; Retract 5mm of filament
    
    G90 
    G1 Y289 F800            ; Move little bit forward
    G1 X10 F6000            ; Move to right of depressor so that the lever flips back
    G1 Y280 F4000           ; Move forward Y for clearance
    