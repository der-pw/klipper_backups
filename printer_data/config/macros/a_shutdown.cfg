## Collection that contains various macros to shut down the printer safely.
##
## Features:
## - Shutdown can be scheduled while a print is running.
## - After the print finishes, the printer waits until the nozzle has cooled
##   down to 60 °C before shutting down.
## - SAFE_SHUTDOWN can also be called while no print is running.
## - If the nozzle is still hot, it will wait until it has cooled down.
##
## Based on the great work of masterq:
## https://klipper.discourse.group/t/providing-macrofile-optionally-shutdown-after-printing/2717


######################################################
## Internal shutdown state
######################################################

[gcode_macro _SHUTDOWN]
variable_printer_active: 0
variable_wants_shutdown: 0
gcode:
  {action_call_remote_method("shutdown_machine")}


######################################################
## Conditional shutdown after print
######################################################

[gcode_macro _CONDITIONAL_SHUTDOWN]
gcode:
  {% if printer["gcode_macro _SHUTDOWN"].wants_shutdown == 1 %}
    SHOW_MSG MSG="Shutdown requested -> cooling down"

    M140 S0
    M104 S0 T0

    TEMPERATURE_WAIT SENSOR="extruder" MAXIMUM=60

    _SHUTDOWN
  {% endif %}


######################################################
## Set / cancel shutdown after print
######################################################

[gcode_macro _SET_COMPLETE_SHUTDOWN]
gcode:
  {% set wants_shutdown = params.ENABLE|default(1)|int %}

  {% if wants_shutdown >= 1 %}
    {% set wants_shutdown = 1 %}
    SHOW_MSG MSG="Print complete -> shutdown"
  {% else %}
    {% set wants_shutdown = 0 %}
    SHOW_MSG MSG="Print complete -> stay on"
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_SHUTDOWN VARIABLE=wants_shutdown VALUE={wants_shutdown}


######################################################
## Print state handlers
######################################################

[gcode_macro _SHUTDOWN_HANDLER_START_PRINT]
gcode:
  SET_GCODE_VARIABLE MACRO=_SHUTDOWN VARIABLE=printer_active VALUE=1


[gcode_macro _SHUTDOWN_HANDLER_STOP_PRINT]
gcode:
  SET_GCODE_VARIABLE MACRO=_SHUTDOWN VARIABLE=printer_active VALUE=0
  _CONDITIONAL_SHUTDOWN


[gcode_macro _SHUTDOWN_HANDLER_CANCEL_PRINT]
gcode:
  _SHUTDOWN_HANDLER_STOP_PRINT


######################################################
## Status
######################################################

[gcode_macro GET_CMPL_STATUS]
description: Show if shutdown after print is enabled
gcode:
  {% set shutdown_wanted = printer["gcode_macro _SHUTDOWN"].wants_shutdown %}
  {% set status_text = "shutdown" if shutdown_wanted else "stay on" %}

  SHOW_MSG MSG="Print complete -> {status_text}"


######################################################
## UI buttons
######################################################

[gcode_macro PRINT_CMPL_SHUTDOWN]
description: Shutdown printer after current print is finished
gcode:
  _SET_COMPLETE_SHUTDOWN ENABLE=1


[gcode_macro PRINT_CMPL_STAY_ON]
description: Cancel scheduled shutdown after print
gcode:
  _SET_COMPLETE_SHUTDOWN ENABLE=0


######################################################
## Safe shutdown
######################################################

[gcode_macro SAFE_SHUTDOWN]
description: Safely shutdown printer or schedule shutdown after active print
gcode:
  {% set printer_active = printer["gcode_macro _SHUTDOWN"].printer_active %}

  {% if printer_active == 1 %}

    SHOW_MSG MSG="Print active -> shutdown scheduled after print"

    _SET_COMPLETE_SHUTDOWN ENABLE=1

  {% else %}

    SHOW_MSG MSG="No print active -> cooling down before shutdown"

    M140 S0
    M104 S0 T0

    TEMPERATURE_WAIT SENSOR="extruder" MAXIMUM=60

    _SHUTDOWN

  {% endif %}


######################################################
## Message handler
######################################################

[gcode_macro SHOW_MSG]
gcode:
  {% set MSG = params.MSG|default("No msg")|string %}

  M117 {MSG}
  RESPOND MSG={'"%s"' % MSG}


######################################################
## Installation / usage
######################################################

# Place this file in your Klipper config directory.
#
# Include it in printer.cfg:
#
# [include macros/auto_shutdown.cfg]
#
#
# Call this in your START_PRINT macro:
#
# _SHUTDOWN_HANDLER_START_PRINT
#
#
# Call this AT THE END of your END_PRINT / stop macro:
#
# _SHUTDOWN_HANDLER_STOP_PRINT
#
#
# Call this in your CANCEL_PRINT macro:
#
# _SHUTDOWN_HANDLER_CANCEL_PRINT
#
#
# Example CANCEL_PRINT:
#
# [gcode_macro CANCEL_PRINT]
# rename_existing: CANCEL_PRINT_BASE
# gcode:
#   _SHUTDOWN_HANDLER_CANCEL_PRINT
#   CANCEL_PRINT_BASE
#
#
# Manual / Home Assistant shutdown:
#
# SAFE_SHUTDOWN
#
#
# During a print:
#
# PRINT_CMPL_SHUTDOWN
#
# -> schedules shutdown after print
#
#
# Cancel scheduled shutdown:
#
# PRINT_CMPL_STAY_ON
#
#
# Show current scheduled shutdown state:
#
# GET_CMPL_STATUS


