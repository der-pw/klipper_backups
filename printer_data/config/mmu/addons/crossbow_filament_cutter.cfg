##########################################################################################
# CUT_FILAMENT Macro
#
# Filament cutter macro for Voron / Happy Hare / MMU style toolchangers using a
# gantry-mounted filament cutter pin or depressor.
#
# This macro moves the toolhead into a fixed cutter position, pushes against the
# cutter lever/pin, retracts the filament after the cut and restores the printer
# to a safe position afterwards.
#
# Features:
# - Parameterized cutter geometry
# - Relative offsets instead of hardcoded motion paths
# - Temporary XY motor current increase during cutting
# - Automatic restoration of configured TMC currents
# - Happy Hare / MMU compatible
#
# The macro assumes:
# - A cutter mounted at the rear of the printer
# - The toolhead physically pushes the cutter mechanism
# - The printer is homed before execution
#
# WARNING:
# Improper cutter positioning, excessive motor current or incorrect offsets may
# cause:
# - missed steps
# - bent cutter pins
# - damaged toolhead parts
# - frame collisions
#
# Especially after changing offsets or printer dimensions, execute this macro
# carefully while monitoring the machine.
#
# This macro was designed for:
# - Voron 2.4
# - TMC2209 drivers
# - Happy Hare / MMU workflows
#
##########################################################################################

[gcode_macro CUT_FILAMENT]
description: Cut filament using the gantry depressor
gcode:

    ########################################
    # Configuration
    ########################################

    # Cutter reference position
    {% set cutter_x = 10 %}
    {% set cutter_y = 270 %}
    {% set cutter_z = 25 %}

    # Relative movement offsets
    {% set lever_offset_x = 10 %}
    {% set pre_cut_y = 14 %}
    {% set cut_trigger_y = 20 %}
    {% set release_y = 19 %}
    {% set clearance_y = 10 %}

    # Motor currents
    {% set normal_x = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set normal_y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set cut_current = 1.0 %}

    ########################################
    # Increase motor current
    ########################################

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cut_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cut_current}

    ########################################
    # Move to cutter
    ########################################

    G91
    G1 Z{cutter_z} F600

    G90

    # Move to cutter start position
    G1 X{cutter_x} Y{cutter_y} F6000

    # Push lever
    G1 X{cutter_x - lever_offset_x} F1000

    # Move in front of cutter
    G1 Y{cutter_y + pre_cut_y} F1000

    # Trigger cut
    G1 Y{cutter_y + cut_trigger_y} F800

    ########################################
    # Retract filament
    ########################################

    G91
    G1 E-25 F1000

    ########################################
    # Leave cutter
    ########################################

    G90

    # Slight release movement
    G1 Y{cutter_y + release_y} F800

    # Move right so lever can flip back
    G1 X{cutter_x} F6000

    # Clearance move
    G1 Y{cutter_y + clearance_y} F4000

    M400

    ########################################
    # Restore motor current
    ########################################

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={normal_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={normal_y}