[include mmu_klipperscreen.conf]

[printer Voron2.4]
titlebar_items: chamber

[preheat ASA]
extruder: 149
heater_bed: 105
;chamber: 60
# optional GCode to run when the option is selected
gcode: _ASA_HEATUP_FANS

[preheat PLA]
extruder: 149
heater_bed: 65

[preheat PETG]
extruder: 149
heater_bed: 85

